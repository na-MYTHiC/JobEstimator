    <script>
      // ------------------------------------------------------------------
      // Auto-update via service worker.
      //
      // The reload on controllerchange fixes the classic "needs two refreshes"
      // PWA trap: sw.js serves assets cache-first, so the refresh that
      // discovers a new deploy has ALREADY rendered with the old cached
      // JS/CSS. Raising a banner when the new worker takes over lets a single
      // tap swap everything over atomically.
      //
      // The worker always activates (sw.js calls skipWaiting) — the page
      // decides when to reload. Ignore the banner and the next cold start is
      // served from the new worker's cache regardless.
      // ------------------------------------------------------------------
      window.APP_VERSION = 'v1.4.1';
      window.__jeUpdatePending = false;
      window.jeShowUpdateBanner = function () {
        var el = document.getElementById('update-banner');
        if (el) el.hidden = false;
      };
      function jeUpdateReady() {
        if (window.__jeUpdatePending) return;
        window.__jeUpdatePending = true;
        window.jeShowUpdateBanner();
      }
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        // Captured before registering: if there's no controller yet this is a
        // first-ever install, where controllerchange fires as a normal part of
        // setup and is NOT an update to announce.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadController) return;
          jeUpdateReady();
        });
        window.addEventListener('load', function () {
          // updateViaCache:'none' makes the browser bypass its HTTP cache
          // when it checks sw.js for a new version. GitHub Pages serves
          // sw.js with max-age=600 by default, so without this a deploy
          // could go unnoticed for ten minutes.
          navigator.serviceWorker
            .register('sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              window.__jeSwReg = reg;
              // Shouldn't happen now that install skips waiting, but a worker
              // left waiting by an older build would otherwise sit forever.
              if (reg.waiting && navigator.serviceWorker.controller) {
                reg.waiting.postMessage({ type: 'je-skip-waiting' });
              }
              // An installed PWA can sit "open" for days without a cold
              // start, so re-check whenever it comes back to the foreground.
              // Cheap: conditional request that 304s unless sw.js changed.
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reg.update().catch(function () {});
              });
            })
            .catch(function () {});
        });
      }
      // Called from the Settings "Check for updates" button.
      window.jeCheckForUpdates = function () {
        if (window.__jeSwReg && window.__jeSwReg.update) {
          return window.__jeSwReg.update();
        }
        return Promise.resolve();
      };

      // What version is actually deployed right now?
      //
      // reg.update() alone can't answer this: it only reacts to a byte change
      // in sw.js, so a deploy that ships a new index.html without bumping the
      // worker's VERSION is completely invisible to it — "Check for updates"
      // would report "you're on the latest version" forever while the cache
      // kept serving the old build. Reading the deployed APP_VERSION straight
      // off the network is the ground truth, independent of all of that.
      //
      // The unique query param is what defeats the HTTP cache (and the
      // service worker routes this param straight to the network). Resolves
      // to null when offline or unparseable — the caller must treat that as
      // "don't know", never as "up to date".
      window.jeFetchDeployedVersion = function () {
        var url = './index.html?je-version-probe=' + Date.now();
        return fetch(url, { cache: 'no-store' })
          .then(function (res) {
            return res && res.ok ? res.text() : null;
          })
          .then(function (html) {
            if (!html) return null;
            var m = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
            return m ? m[1] : null;
          })
          .catch(function () {
            return null;
          });
      };

      // Have the active worker re-pull the shell from the network, then
      // reload onto it. A bare location.reload() is not enough: the worker
      // answers navigations cache-first, so a plain reload just re-serves the
      // stale shell it already has.
      window.jeForceRefresh = function () {
        var sw = navigator.serviceWorker;
        if (!sw || !sw.controller) {
          location.reload();
          return;
        }
        var reloaded = false;
        function go() {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        }
        sw.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'je-shell-refreshed') go();
        });
        sw.controller.postMessage({ type: 'je-refresh-shell' });
        // Never hang on a worker that doesn't answer — reload anyway.
        setTimeout(go, 5000);
      };
    </script>
    <script>
      // Surface any boot-time JS error directly on the page so a white screen
      // never happens silently — the user can read the actual problem.
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || e.error)) ? (e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')) : 'Unknown error';
        var root = document.getElementById('root');
        if (root && !root.__errored) {
          root.__errored = true;
          root.innerHTML =
            '<div style="font-family:ui-sans-serif,system-ui;padding:24px;color:#1a1a1a;background:#fff;min-height:100vh;">' +
              '<h2 style="margin:0 0 8px 0;color:#C8102E;">Job Estimator failed to load</h2>' +
              '<p style="margin:0 0 12px 0;font-size:14px;">Open this in a browser, hard-refresh (Ctrl+Shift+R / Cmd+Shift+R), or screenshot the error below:</p>' +
              '<pre style="background:#F2F4F7;border:1px solid #8A94A6;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;">' +
                String(msg).replace(/[<>&]/g, function (c) { return { '<':'&lt;','>':'&gt;','&':'&amp;' }[c]; }) +
              '</pre>' +
            '</div>';
        }
      });
    </script>

      /* Update banner. `display` lives here rather than in an inline style so
         the `hidden` attribute actually works — an inline `display:flex` beats
         the UA stylesheet's `[hidden] { display:none }` and pinned the banner
         permanently on screen. Both rules being in the stylesheet lets the
         more specific `[hidden]` selector win. */
      #update-banner {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 520px;
        margin: 0 auto;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgb(var(--c-ink));
        color: rgb(var(--c-on-ink));
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        font-size: 14px;
      }
      #update-banner[hidden] {
        display: none;
      }
      #update-banner-reload {
        background: rgb(var(--c-accent));
        color: rgb(var(--c-on-accent));
        border: none;
        padding: 8px 14px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      #update-banner-dismiss {
        background: transparent;
        border: none;
        color: rgb(var(--c-on-ink) / 0.7);
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        padding: 0 6px;

    <!-- Persistent update banner. Raised by the service-worker controllerchange
         handler above. Lives outside the React tree so it works even if the
         app itself fails to boot. -->
    <div id="update-banner" role="status" hidden>
      <div style="flex:1;line-height:1.35;">
        <strong style="display:block;font-weight:700;">Update available</strong>
        <span style="opacity:0.75;">Tap reload to apply it.</span>
      </div>
      <button id="update-banner-reload">Reload</button>
      <button id="update-banner-dismiss" aria-label="Dismiss update banner">&times;</button>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var reload = document.getElementById('update-banner-reload');
        var dismiss = document.getElementById('update-banner-dismiss');
        if (reload) reload.addEventListener('click', function () {
          var b = document.getElementById('update-banner');
          if (b) b.hidden = true;
          window.__jeUpdatePending = false;
          location.reload();
        });
        if (dismiss) dismiss.addEventListener('click', function () {
          var b = document.getElementById('update-banner');
          if (b) b.hidden = true;
          // Cleared so a later "Check for updates" reports honestly instead of
          // still thinking an update is outstanding.
          window.__jeUpdatePending = false;
        });
      });
    </script>

        if (item.tierType === 'flat') return qty * item.price;

      // nothing upstream of the quote in the app. A cash quote is the same

      //
      // Every cash figure on screen — the KPI total, the quote footer, the
      // volume-tier hint — is derived from this one constant, so the numbers
      // can't drift apart when the rate changes. Change it here only.
      // --------------------------------------------------------------------
      const CASH_DISCOUNT_RATE = 0.1735537190082645;

      const round2 = (n) => Math.round((n || 0) * 100) / 100;

      // Cash terms for a quoted total: what the discount line reads, and what
      // the customer actually pays. Both are rounded to whole cents against
      // the already-rounded quoted total, so the three rows on the quote
      // (total, savings, cash price) add up exactly as printed — no penny
      // that only exists in floating point.
      function cashTerms(quotedTotal) {
        const quoted = round2(quotedTotal);
        const discount = round2(quoted * CASH_DISCOUNT_RATE);
        return { quoted, discount, total: round2(quoted - discount) };

      // to take down the app.
      // --------------------------------------------------------------------
      function usePersistedState(key, initialValue) {
        const storageKey = 'je:' + key;
        const [value, setValue] = useState(() => {
          try {
            const raw = localStorage.getItem(storageKey);
            return raw === null ? initialValue : JSON.parse(raw);
          } catch (e) {
            return initialValue;
          }
        });
        useEffect(() => {
          try {
            localStorage.setItem(storageKey, JSON.stringify(value));
          } catch (e) {
            /* storage unavailable — settings just won't persist this session */
          }
        }, [storageKey, value]);
        return [value, setValue];

      function UpdateRow() {
        const [status, setStatus] = useState('');
        const [busy, setBusy] = useState(false);
        // Compare the running build against what's actually deployed, rather
        // than inferring it from whether a new service worker turned up.
        //
        // The old version of this waited 1200ms and said "you're on the
        // latest version" if no banner had appeared yet — which was a guess,
        // and wrong twice over: it reported up-to-date when the worker was
        // still installing on a slow connection, and it reported up-to-date
        // when sw.js hadn't changed and so nothing would EVER appear. Asking
        // the network for the deployed version answers the question directly.
        const check = async () => {
          setBusy(true);
          setStatus('Checking…');
          try {
            const [deployed] = await Promise.all([
              window.jeFetchDeployedVersion
                ? window.jeFetchDeployedVersion()
                : Promise.resolve(null),
              // Still kick the normal worker update — if sw.js did change,
              // this is the path that cleans up the old caches properly.
              window.jeCheckForUpdates ? window.jeCheckForUpdates() : Promise.resolve(),
            ]);
            const running = window.APP_VERSION || 'v0';

            if (deployed === null) {
              // Couldn't reach the network. Say so — don't claim up to date.
              setStatus('No connection — try again on Wi-Fi.');
              setBusy(false);
              return;
            }
            if (deployed !== running) {
              setStatus(`Updating to ${deployed}…`);
              window.jeForceRefresh();
              return; // page is about to reload
            }
            setStatus(`You're on the latest version (${deployed}).`);
            setBusy(false);
          } catch (e) {
            setStatus('Check failed — try again.');
            setBusy(false);
          }
        };
        return (
          <div className="pt-3 border-t border-line">
            <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
              About

              >
                Check for updates
              </button>
            </div>
          </div>
        );
      }

            if (e.key === 'Escape') setOpen(false);
          }
          document.addEventListener('mousedown', handleDocClick);
          document.addEventListener('keydown', handleEsc);
          return () => {
            document.removeEventListener('mousedown', handleDocClick);
            document.removeEventListener('keydown', handleEsc);
          };
        }, [open]);

        return (
          <div ref={wrapRef} className="relative">
            <button
              onClick={() => setOpen((o) => !o)}
              className={
                'w-9 h-9 rounded-full flex items-center justify-center transition-all ring-1 ' +
                (open
                  ? 'bg-white text-brand-orange ring-white shadow-sm'
                  : 'bg-onAccent/15 text-onAccent ring-onAccent/30 hover:bg-onAccent/25')
              }
              aria-label="Settings"
              aria-expanded={open}
              title="Settings"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className="w-5 h-5"
              >
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            </button>

            {open && (
              <div className="absolute right-0 mt-2 z-50 w-72 max-w-[calc(100vw-1rem)] rounded-2xl bg-surface text-content shadow-xl ring-1 ring-line overflow-hidden">
                <div className="px-4 py-3 border-b border-line flex items-center justify-between">
                  <div className="font-bold text-sm tracking-tight">Settings</div>
                  <button
                    onClick={() => setOpen(false)}
                    className="text-muted hover:text-content text-lg leading-none"
                    aria-label="Close settings"
                  >
                    ×
                  </button>
                </div>

                <div className="px-4 py-3 space-y-4">
                  <div>
                    <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
                      Mode
                    </div>
                    <Toggle
                      ariaLabel="Mode"
                      value={theme}
                      onChange={setTheme}
                      options={[
                        { value: 'light', label: 'Light' },
                        { value: 'dark', label: 'Dark' },
                      ]}
                    />
                  </div>

                  <div>
                    <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
                      Theme
                    </div>
                    <ThemeSelect value={colorTheme} onChange={setColorTheme} />
                  </div>

                  <div>
                    <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
                      Zoom
                    </div>
                    <ZoomControl
                      zoom={zoom}
                      onZoomIn={onZoomIn}
                      onZoomOut={onZoomOut}
                      onZoomReset={onZoomReset}
                    />
                  </div>

                  <div>
                    <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
                      Product Picker
                    </div>
                    <Toggle
                      ariaLabel="Product picker style"
                      value={pickerMode}
                      onChange={setPickerMode}
                      options={[
                        { value: 'split', label: 'Category + Type' },
                        { value: 'classic', label: 'Classic list' },
                      ]}
                    />
                  </div>

                  <div>
                    <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
                      Density
                    </div>
                    <Toggle
                      ariaLabel="Density"
                      value={density}
                      onChange={setDensity}
                      options={[
                        { value: 'compact', label: 'Compact' },
                        { value: 'comfortable', label: 'Comfortable' },
                      ]}
                    />
                  </div>

                  <div className="pt-3 border-t border-line space-y-2.5">
                    <SwitchRow
                      label="Show volume-tier hints"
                      checked={showTierHint}
                      onChange={setShowTierHint}
                    />
                    <SwitchRow
                      label="Sticky totals while scrolling"
                      checked={stickyTotals}
                      onChange={setStickyTotals}
                    />
                  </div>

                  <UpdateRow />
                </div>
              </div>
            )}
          </div>
        );
      }

      function Header({
        view,
        setView,
        theme,
        setTheme,
        colorTheme,
        setColorTheme,
        zoom,
        onZoomIn,
        onZoomOut,
        onZoomReset,
        density,
        setDensity,
        showTierHint,
        setShowTierHint,
        stickyTotals,
        setStickyTotals,
        pickerMode,
        setPickerMode,
      }) {
        return (
          <header className="app-header bg-gradient-to-r from-brand-orange via-brand-orangeAccent to-brand-orangeLight text-onAccent">
            <div className="px-3 sm:px-8 py-2 sm:py-3 flex flex-row items-center gap-3 sm:gap-6">
              <div className="leading-tight min-w-0 flex-shrink">
                <h1 className="text-base sm:text-xl md:text-2xl font-extrabold tracking-tight truncate">
                  Tempest Windows
                </h1>
                <div className="text-[11px] sm:text-xs md:text-sm font-medium text-onAccent/85 mt-0.5 truncate">
                  Job Estimator
                </div>
              </div>

              <div className="flex-1" />

              <div className="flex flex-shrink-0 items-center gap-2 sm:gap-3">
                <Toggle
                  ariaLabel="View"
                  value={view}
                  onChange={setView}
                  options={[
                    { value: 'pricing', label: 'Pricing Tool' },
                    { value: 'catalog', label: 'Catalog' },
                  ]}
                />
                <SettingsMenu
                  theme={theme}
                  setTheme={setTheme}
                  colorTheme={colorTheme}
                  setColorTheme={setColorTheme}
                  zoom={zoom}
                  onZoomIn={onZoomIn}
                  onZoomOut={onZoomOut}
                  onZoomReset={onZoomReset}
                  density={density}
                  setDensity={setDensity}
                  showTierHint={showTierHint}
                  setShowTierHint={setShowTierHint}
                  stickyTotals={stickyTotals}
                  setStickyTotals={setStickyTotals}
                  pickerMode={pickerMode}
                  setPickerMode={setPickerMode}
                />
              </div>
            </div>
          </header>
        );
      }

      // --------------------------------------------------------------------
      // Pricing Tool
      // --------------------------------------------------------------------
      const BLANK_FORM = { familyKey: '', itemId: '', qty: '', colorKey: 'WB' };

      function PricingTool({
        form,
        setForm,
        lines,
        setLines,
        resetTick,
        setResetTick,
        density = 'comfortable',
        showTierHint = true,
        stickyTotals = false,
        pickerMode = 'split',
        payMode = 'finance',
        setPayMode = () => {},
      }) {
        const blank = BLANK_FORM;
        const compact = density === 'compact';
        const isSplitPicker = pickerMode === 'split';
        const d = {
          card: compact ? 'p-3' : 'p-5',
          section: compact ? 'px-4 py-2' : 'px-5 py-3',
          sectionTight: compact ? 'px-4 py-1.5' : 'px-5 py-2.5',
          form: compact ? 'p-3 gap-3' : 'p-5 gap-4',
          rowY: compact ? 'py-1' : 'py-2',
          rowYTight: compact ? 'py-1.5' : 'py-2.5',
          rowX: compact ? 'px-2.5' : 'px-4',
          gapY: compact ? 'space-y-3' : 'space-y-6',
          kpiGap: compact ? 'gap-2' : 'gap-4',
        };

        // Total units across the job = sum of all primary-window line quantities.
        const totalUnits = useMemo(
          () =>
            lines.reduce((sum, ln) => {
              const item = ITEM_BY_ID[ln.itemId];
              if (!item || item.family === 'Add-on') return sum;
              return sum + Number(ln.qty || 0);
            }, 0),
          [lines],
        );

        const currentItem = ITEM_BY_ID[form.itemId];
        const qtyNum = Number(form.qty || 0);

        // Live preview: include this in-progress line in the tier roll-up
        const previewTotalUnits = useMemo(() => {
          if (!currentItem || currentItem.family === 'Add-on') return totalUnits;
          return totalUnits + qtyNum;
        }, [totalUnits, currentItem, qtyNum]);

        const currentLinePrice = useMemo(
          () => linePrice(currentItem, qtyNum, form.colorKey, previewTotalUnits),
          [currentItem, qtyNum, form.colorKey, previewTotalUnits],
        );

        // Net (final) total — what they actually pay at the locked-in volume tier.
        const jobNetTotal = useMemo(() => {
          return lines.reduce((sum, ln) => {
            const item = ITEM_BY_ID[ln.itemId];
            return sum + linePrice(item, Number(ln.qty || 0), ln.colorKey, totalUnits);
          }, 0);
        }, [lines, totalUnits]);

        // Gross subtotal — same lines priced at the un-discounted tier-1 (1–9 / 1–14) rate.
        const jobGrossTotal = useMemo(() => {
          return lines.reduce((sum, ln) => {
            const item = ITEM_BY_ID[ln.itemId];
            return sum + lineSubtotalGross(item, Number(ln.qty || 0), ln.colorKey);
          }, 0);
        }, [lines]);

        const volumeSavings = jobGrossTotal - jobNetTotal;
        const grandTotal = jobNetTotal + currentLinePrice;

        // Cash quotes don't reprice the job — the lines, the subtotal and the
        // volume savings are all identical. The only difference is a savings
        // line at the bottom, so both totals are derived from the finance
        // numbers already computed above.
        const isCash = payMode === 'cash';
        const netTerms = useMemo(() => cashTerms(jobNetTotal), [jobNetTotal]);
        const grandTerms = useMemo(() => cashTerms(grandTotal), [grandTotal]);

        // Tier optimizer: find the closest upcoming break across all tier types in the job.
        // The label is generic ("units") — every primary line, doors included, counts toward totalUnits.
        const tierTip = useMemo(() => {
          if (totalUnits <= 0) return [];
          const candidates = [];
          const usingMezzo = lines.some((ln) => ITEM_BY_ID[ln.itemId]?.tierType === 'mezzo');
          const usingCasement = lines.some((ln) => ITEM_BY_ID[ln.itemId]?.tierType === 'casement');
          if (usingMezzo) {
            if (totalUnits < 10) candidates.push({ target: 10, label: '10–19' });
            else if (totalUnits < 20) candidates.push({ target: 20, label: '20+' });
          }
          if (usingCasement && totalUnits < 15) {
            candidates.push({ target: 15, label: '15+' });
          }
          if (!candidates.length) return [];
          // Pick the closest reachable break (within 6 units)
          candidates.sort((a, b) => a.target - b.target);
          const next = candidates.find((c) => c.target - totalUnits <= 6 && c.target - totalUnits > 0);
          if (!next) return [];
          const atCurrent = lines.reduce(
            (s, ln) => s + linePrice(ITEM_BY_ID[ln.itemId], Number(ln.qty || 0), ln.colorKey, totalUnits),
            0,
          );
          const atTarget = lines.reduce(
            (s, ln) => s + linePrice(ITEM_BY_ID[ln.itemId], Number(ln.qty || 0), ln.colorKey, next.target),
            0,
          );
          const savings = atCurrent - atTarget;
          if (savings <= 0) return [];
          // Quote the break in whatever terms the rep is showing — on a cash
          // quote the tier saving gets discounted right along with the total,
          // so an undiscounted figure here would overstate it.
          return [
            {
              needed: next.target - totalUnits,
              nextTier: next.label,
              savings: isCash ? cashTerms(savings).total : savings,
            },
          ];
        }, [lines, totalUnits, isCash]);

        function addLine() {
          if (!form.itemId || !qtyNum) return;
          setLines((ls) => [...ls, { ...form, qty: qtyNum, key: Date.now() }]);
          setForm({ ...blank });
        }

        function resetAll() {
          setForm({ ...blank });
          setLines([]);
          // A new appointment starts on standard terms — cash is something the
          // rep opts into per customer, not a setting they inherit.
          setPayMode('finance');
          setResetTick((t) => t + 1);
        }

        const kpiCardPad = compact ? 'p-3' : 'p-5';
        const kpiCardLabel =
          'text-[10px] uppercase tracking-[0.2em] text-muted font-semibold';
        const kpiCardValue = (compact ? 'text-2xl' : 'text-3xl') + ' font-extrabold tabular-nums';

        return (
          <div className={d.gapY}>
            {/* KPI strip — Total Units / Total Amount / Volume tier (sticky optional) */}
            <div
              className={
                stickyTotals
                  ? 'sticky top-0 z-30 -mx-4 sm:-mx-8 px-4 sm:px-8 py-2 bg-page/95 bg-page/95 backdrop-blur'
                  : ''
              }
            >
              <div className={'grid grid-cols-1 md:grid-cols-3 ' + d.kpiGap}>
                <Card className={kpiCardPad}>
                  <div className={kpiCardLabel}>Total Units</div>
                  <div className={'mt-1 ' + kpiCardValue + ' text-content'}>
                    {previewTotalUnits}
                  </div>
                </Card>
                <Card className={kpiCardPad}>
                  <div className={kpiCardLabel}>Total Amount</div>
                  <div className={'mt-1 ' + kpiCardValue + ' text-brand-orange'}>
                    {fmt(isCash ? grandTerms.total : grandTotal)}
                  </div>
                  <div className="mt-0.5 text-[11px] font-semibold text-muted">
                    {isCash ? 'Cash price — savings applied' : 'Financed terms'}
                  </div>
                </Card>
                <Card className={kpiCardPad}>
                  <div className={kpiCardLabel}>Volume Tier</div>
                  <div className="mt-1 text-sm font-semibold text-content">
                    {tierLabel(previewTotalUnits)}
                  </div>
                </Card>
              </div>
            </div>

            {/* Payment terms. Lives here rather than in Settings because the rep
                flips it in front of the customer, mid-quote, not once at setup. */}
            <div className="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
              <div className="flex items-center gap-3">
                <span className="text-[10px] uppercase tracking-[0.2em] text-muted font-semibold">
                  Payment
                </span>
                <Toggle
                  ariaLabel="Payment terms"
                  value={payMode}
                  onChange={setPayMode}
                  options={[
                    { value: 'finance', label: 'Finance' },
                    { value: 'cash', label: 'Cash' },
                  ]}
                />
              </div>
              {isCash && netTerms.discount > 0 && (
                <div className="text-xs font-bold text-emerald-600 dark:text-emerald-400">
                  Cash deal savings — {fmt(netTerms.discount)} off the total
                </div>
              )}
            </div>

            {/* Tier optimizer hint — hidden when the rep disables it in settings */}
            {showTierHint && tierTip.length > 0 && (
              <div className="space-y-2">
                {tierTip.map((t, i) => (
                  <div
                    key={i}
                    className={
                      'rounded-xl bg-gradient-to-r from-brand-orange/15 to-brand-orangeLight/20 dark:from-brand-orange/20 dark:to-brand-orangeLight/10 border border-brand-orange/40 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 ' +
                      (compact ? 'px-3 py-2' : 'px-4 py-3')
                    }
                  >
                    <div className={compact ? 'text-xl' : 'text-2xl'}>⭐</div>
                    <div className="flex-1 text-sm text-content">
                      <span className="font-bold">
                        Add {t.needed} more unit{t.needed === 1 ? '' : 's'}
                      </span>{' '}
                      to unlock the <span className="font-bold">{t.nextTier}</span> volume tier — drops existing line
                      prices by <span className="font-extrabold text-brand-orange">{fmt(t.savings)}</span>.
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Estimator form */}
            <Card className="overflow-hidden">
              <div className={'bg-brand-orange text-onAccent flex items-center justify-between gap-3 ' + d.sectionTight}>
                <div className="font-bold tracking-tight">Add an Item</div>
                <button
                  onClick={resetAll}
                  className="inline-flex items-center justify-center gap-2 rounded-lg bg-danger hover:brightness-110 text-white px-3 py-1.5 text-xs font-bold tracking-wide shadow-sm transition-colors ring-1 ring-white/25"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.4"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className="w-3.5 h-3.5"
                  >
                    <path d="M3 12a9 9 0 1 0 3-6.7" />
                    <path d="M3 4v5h5" />
                  </svg>
                  Reset
                </button>
              </div>
              <div className={'grid grid-cols-1 md:grid-cols-12 ' + d.form}>
                {isSplitPicker ? (
                  <Fragment>
                    <div className="md:col-span-6">
                      <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                        Category
                      </label>
                      <select
                        key={'family-' + resetTick}
                        value={form.familyKey}
                        onChange={(e) =>
                          // Picking a new category also clears the type selection,
                          // otherwise a leftover itemId would silently price the
                          // wrong line.
                          setForm((f) => ({ ...f, familyKey: e.target.value, itemId: '' }))
                        }
                        className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange"
                      >
                        <option value="">Select category…</option>
                        {FAMILIES.map((fam) => (
                          <option key={fam.key} value={fam.key}>
                            {fam.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="md:col-span-6">
                      <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                        Type
                      </label>
                      <select
                        key={'item-' + resetTick + '-' + form.familyKey}
                        value={form.itemId}
                        onChange={(e) => setForm((f) => ({ ...f, itemId: e.target.value }))}
                        disabled={!form.familyKey}
                        className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <option value="">
                          {form.familyKey ? 'Select type…' : 'Pick a category first…'}
                        </option>
                        {form.familyKey &&
                          (FAMILIES.find((f) => f.key === form.familyKey)?.items || []).map((w) => (
                            <option key={w.id} value={w.id}>
                              {w.label}
                            </option>
                          ))}
                      </select>
                    </div>
                  </Fragment>
                ) : (
                  /* Classic: one long grouped list. Setting familyKey alongside
                     itemId keeps state valid if the rep switches back to split. */
                  <div className="md:col-span-5">
                    <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                      Product Type
                    </label>
                    <select
                      key={'item-classic-' + resetTick}
                      value={form.itemId}
                      onChange={(e) => {
                        const id = e.target.value;
                        const picked = ITEM_BY_ID[id];
                        setForm((f) => ({ ...f, itemId: id, familyKey: picked ? picked.family : '' }));
                      }}
                      className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange"
                    >
                      <option value="">Select product type…</option>
                      {FAMILIES.map((fam) => (
                        <optgroup key={fam.key} label={fam.label}>
                          {fam.items.map((w) => (
                            <option key={w.id} value={w.id}>
                              {w.label}
                            </option>
                          ))}
                        </optgroup>
                      ))}
                    </select>
                  </div>
                )}

                <div className={isSplitPicker ? 'md:col-span-3' : 'md:col-span-2'}>
                  <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                    Quantity
                  </label>
                  <input
                    key={'qty-' + resetTick}
                    type="number"
                    min="0"
                    placeholder="0"
                    value={form.qty}
                    onChange={(e) => setForm((f) => ({ ...f, qty: e.target.value }))}
                    className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-semibold text-content focus:outline-none focus:ring-2 focus:ring-brand-orange tabular-nums"
                  />
                </div>

                <div className={isSplitPicker ? 'md:col-span-9' : 'md:col-span-5'}>
                  <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                    Color
                  </label>
                  <select
                    key={'color-' + resetTick}
                    value={form.colorKey}
                    onChange={(e) => setForm((f) => ({ ...f, colorKey: e.target.value }))}
                    disabled={currentItem && currentItem.tierType === 'flat'}
                    title={currentItem && currentItem.tierType === 'flat' ? 'Color does not apply to add-on options' : ''}
                    className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange disabled:opacity-50"
                  >
                    {COLORS.map((c) => (
                      <option key={c.key} value={c.key}>
                        {c.label} {c.multiplier !== 1 ? `(+${Math.round((c.multiplier - 1) * 100)}%)` : ''}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Live line readout */}
                <div className="md:col-span-12">
                  <div
                    className={
                      'rounded-xl bg-page bg-surface2 border border-line flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6 ' +
                      (compact ? 'px-3 py-2' : 'px-4 py-3')
                    }
                  >
                    <div className="flex-1 text-sm text-content">
                      {currentItem ? (
                        <Fragment>
                          <span className="font-semibold">{currentItem.label}</span>
                          <span className="text-muted">
                            {' '}
                            • {currentItem.family}
                          </span>
                        </Fragment>
                      ) : (
                        <span className="text-muted">
                          Pick a product type to preview the price.
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-4">
                      <div className="text-right">
                        <div className="text-[10px] uppercase tracking-[0.2em] text-muted font-semibold">
                          Line Price
                        </div>
                        <div className="text-xl font-extrabold text-brand-orange tabular-nums">
                          {fmt(currentLinePrice)}
                        </div>
                      </div>
                      <button
                        onClick={addLine}
                        disabled={!form.itemId || !qtyNum}
                        className="rounded-xl bg-ink hover:brightness-125 text-onInk px-4 py-2.5 text-sm font-bold shadow-sm disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                      >
                        + Add to Job
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </Card>

            {/* Job line items */}
            <Card className="overflow-hidden">
              <div className={'bg-ink text-onInk flex items-center justify-between ' + d.section}>
                <div className="font-bold tracking-tight">Job Line Items</div>
                <Pill tone="onInk">{lines.length} line{lines.length === 1 ? '' : 's'}</Pill>
              </div>
              {lines.length === 0 ? (
                <div className="p-8 text-center text-muted text-sm">
                  No items added yet. Build your estimate above.
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-surface2 text-content uppercase text-[10px] tracking-wider">
                      <tr>
                        <th className="px-4 py-2 text-left">Item</th>
                        <th className="px-4 py-2 text-left">Family</th>
                        <th className="px-4 py-2 text-left">Color</th>
                        <th className="px-4 py-2 text-right">Qty</th>
                        <th className="px-4 py-2 text-right">Line Price</th>
                        <th className="px-4 py-2"></th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-line">
                      {lines.map((ln, idx) => {
                        const item = ITEM_BY_ID[ln.itemId];
                        const color = COLORS.find((c) => c.key === ln.colorKey);
                        const td = d.rowX + ' ' + d.rowY;
                        return (
                          <tr key={ln.key} className="hover:bg-surface2">
                            <td className={td + ' font-semibold text-content'}>
                              {item ? item.label : '—'}
                            </td>
                            <td className={td + ' text-muted'}>
                              {item ? item.family : '—'}
                            </td>
                            <td className={td + ' text-muted'}>
                              {!item || item.tierType === 'flat' ? '—' : color ? color.label : '—'}
                            </td>
                            <td className={td + ' text-right'}>
                              <input
                                type="number"
                                min="0"
                                value={ln.qty}
                                onChange={(e) => {
                                  const v = e.target.value;
                                  setLines((ls) =>
                                    ls.map((l, i) =>
                                      i === idx ? { ...l, qty: v === '' ? 0 : Number(v) } : l,
                                    ),
                                  );
                                }}
                                className="w-16 text-right tabular-nums font-medium text-content bg-transparent rounded-md px-1.5 py-1 border border-transparent hover:border-line hover:border-line hover:bg-white hover:bg-surface focus:bg-white focus:bg-surface focus:ring-2 focus:ring-brand-orange focus:outline-none focus:border-transparent"
                              />
                            </td>
                            <td className={td + ' text-right tabular-nums font-bold text-brand-orange'}>
                              {fmt(linePrice(item, Number(ln.qty), ln.colorKey, totalUnits))}
                            </td>
                            <td className={td + ' text-right'}>
                              <button
                                onClick={() => setLines((ls) => ls.filter((_, i) => i !== idx))}
                                className="text-muted hover:text-brand-red font-bold text-lg leading-none"
                                aria-label="Remove line"
                              >
                                ×
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot className="bg-surface2">
                      <tr>
                        <td
                          colSpan="4"
                          className="px-4 py-2 text-right text-xs uppercase tracking-wider font-semibold text-muted"
                        >
                          Subtotal
                        </td>
                        <td className="px-4 py-2 text-right text-sm font-bold text-content tabular-nums">
                          {fmt(jobGrossTotal)}
                        </td>
                        <td></td>
                      </tr>
                      {volumeSavings > 0 && (
                        <tr>
                          <td
                            colSpan="4"
                            className="px-4 py-2 text-right text-xs uppercase tracking-wider font-semibold text-emerald-700 dark:text-emerald-400"
                          >
                            Volume Savings
                          </td>
                          <td className="px-4 py-2 text-right text-sm font-extrabold text-emerald-600 dark:text-emerald-400 tabular-nums">
                            −{fmt(volumeSavings)}
                          </td>
                          <td></td>
                        </tr>
                      )}
                      {/* On a cash quote the Total steps down to a plain line and
                          Cash Price becomes the headline — the customer should read
                          the bottom row as the number they're paying. */}
                      <tr className="border-t-2 border-line">
                        <td
                          colSpan="4"
                          className="px-4 py-3 text-right text-xs uppercase tracking-[0.2em] font-bold text-content"
                        >
                          Total
                        </td>
                        <td
                          className={
                            'px-4 py-3 text-right tabular-nums ' +
                            (isCash
                              ? 'text-base font-bold text-content'
                              : 'text-lg font-extrabold text-brand-orange')
                          }
                        >
                          {fmt(netTerms.quoted)}
                        </td>
                        <td></td>
                      </tr>
                      {isCash && (
                        <Fragment>
                          <tr>
                            <td
                              colSpan="4"
                              className="px-4 py-2 text-right text-xs uppercase tracking-wider font-semibold text-emerald-700 dark:text-emerald-400"
                            >
                              Cash Deal Savings
                            </td>
                            <td className="px-4 py-2 text-right text-sm font-extrabold text-emerald-600 dark:text-emerald-400 tabular-nums">
                              −{fmt(netTerms.discount)}
                            </td>
                            <td></td>
                          </tr>
                          <tr className="border-t-2 border-line">
                            <td
                              colSpan="4"
                              className="px-4 py-3 text-right text-xs uppercase tracking-[0.2em] font-bold text-content"
                            >
                              Cash Price
                            </td>
                            <td className="px-4 py-3 text-right text-lg font-extrabold text-brand-orange tabular-nums">
                              {fmt(netTerms.total)}
                            </td>
                            <td></td>
                          </tr>
                        </Fragment>
                      )}
                    </tfoot>
                  </table>
                </div>
              )}
            </Card>

          </div>
        );
      }

      // --------------------------------------------------------------------
      // Catalog — replicates the spreadsheet's two-column layout:
      //   Left column  = PAR PRICES sections
      //   Right column = SIZE LIMITS sections
      // --------------------------------------------------------------------

      // Size-limit sections, taken directly from the Price_and_Sizes sheet.
      // Each row is [Style, Min W (in), Max W (in), Min H (in), Max H (in)].
      const SIZE_SECTIONS = [
        {
          title: 'MEZZO',
          rows: [
            ['DH', '12', '50', '20', '72'],
            ['2LS', '18.5', '96', '11.25', '72'],
            ['3LS 192 UI', '47.5', '120', '11.25', '72'],
            ['PIC 154 UI', '9.5', '112', '9.5', '112'],
            ['TRAPEZOID 154 UI', '12', '112', '6 / 11.5', '108'],
          ],
          note: 'Any DH between 72" and 96", or any DH with a top sash ≥ 36", must use a SH.',
        },
        {
          title: 'FUSION',
          rows: [
            ['CIR TOP', '11.5', '96', '6 / 12', '96 / 107'],
            ['CIR T w/leg 148 UI', '23.5', '96', '11.5', '48'],
            ['SPEC SH', '23.5', '47', '43', '96'],
            ['TRAP 192 UI', '23.5', '72', '18', '96'],
          ],
        },
        {
          title: 'PATIO DOORS',
          rows: [
            ['2 LITE 200', '47.5', '120', '47.5', '96'],
            ['3 LITE 216 UI', '71.5', '130', '47.5', '96'],
            ['4 LITE 240 UI', '95.5', '144', '47.5', '96'],
          ],
        },
        {
          title: 'MEZZO TRIPLE PANE',
          rows: [
            ['PIC', '9.5', '86', '9.5', '86'],
            ['PIC', '27', '84', '13.5', '42'],
            ['PIC', '27', '47', '43', '96'],
          ],
        },
        {
          title: 'MEZZO STUCCO SPECIALTY',
          rows: [
            ['PIC', '27', '60', '27', '60'],
            ['CIRCLE TOP', '27', '96', '13.5', '48'],
            ['CIR T w/leg', '27', '84', '15', '96'],
            ['PIC', '27', '47', '43', '96'],
          ],
          note: 'Use 80 Series on any Circle Top if width is below 27" (available down to 23.5").',
        },
      ];

      function CatalogTable({ title, headers, rows, tone = 'orange', muted = false, density = 'comfortable', note }) {
        const compact = density === 'compact';
        // Foreground is paired with each background rather than hardcoded to
        // white: on Monochrome dark the accent is near-white and the ink is
        // near-black, so a single fixed text colour is unreadable on one of
        // them no matter which you pick.
        const headStyles = {
          orange: 'bg-brand-orange text-onAccent',
          navy: 'bg-ink text-onInk',
          grey: 'bg-ink text-onInk',
          muted: 'bg-muted text-surface',
        };
        const headClass = headStyles[tone] || headStyles.orange;
        const headerPad = compact ? 'px-4 py-1.5' : 'px-5 py-2.5';
        const thPad = compact ? 'px-3 py-1' : 'px-3 py-2';
        const tdPad = compact ? 'px-3 py-1' : 'px-3 py-2';
        return (
          <Card className="overflow-hidden">
            <div className={'font-bold tracking-tight text-sm ' + headClass + ' ' + headerPad}>
              {title}
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-surface2 text-content text-[11px] uppercase tracking-wider">
                    {headers.map((h, i) => (
                      <th key={i} className={thPad + ' ' + (i === 0 ? 'text-left' : 'text-right')}>
                        {h}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-line">
                  {rows.map((r, i) => (
                    <tr
                      key={i}
                      className={
                        'hover:bg-surface2 ' +
                        (muted ? 'text-muted italic' : '')
                      }
                    >
                      {r.map((cell, j) => (
                        <td
                          key={j}
                          className={
                            tdPad +
                            ' ' +
                            (j === 0
                              ? 'text-left font-semibold ' + (muted ? '' : 'text-content')
                              : 'text-right tabular-nums ' + (muted ? '' : 'text-content'))
                          }
                        >
                          {cell}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {note && (
              <div
                className={
                  'border-t border-line text-[11px] italic text-muted ' +
                  (compact ? 'px-3 py-1.5' : 'px-4 py-2')
                }
              >
                {note}
              </div>
            )}
          </Card>
        );
      }

      function Catalog({ density = 'comfortable' }) {
        const compact = density === 'compact';
        const cardPad = compact ? 'p-3' : 'p-5';
        const colGap = compact ? 'space-y-3' : 'space-y-5';
        const sectionGap = compact ? 'space-y-3' : 'space-y-6';
        const sizeHeaders = ['Style', 'Min W (")', 'Max W (")', 'Min H (")', 'Max H (")'];

        return (
          <div className={sectionGap}>
            <Card className={cardPad}>
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div className="text-[10px] uppercase tracking-[0.2em] text-brand-orange font-bold">Catalog</div>
                  <div className="text-xl font-extrabold text-content">Par Prices & Size Limits</div>
                  <div className="text-sm text-muted mt-1">
                    Prices and sizes laid out side-by-side, matching the master spreadsheet. Apply the color factor
                    for Desert Clay or Black / Bronze.
                  </div>
                </div>
                <div className="flex flex-wrap gap-2">
                  <Pill tone="orange">White / Beige ×1.00</Pill>
                  <Pill tone="navy">Desert Clay ×1.10</Pill>
                  <Pill tone="grey">Black / Bronze ×1.25</Pill>
                </div>
              </div>
            </Card>

            <div className={'grid grid-cols-1 lg:grid-cols-2 items-start ' + (compact ? 'gap-3' : 'gap-6')}>
              {/* ----------- LEFT COLUMN — PAR PRICES ----------- */}
              <div className={colGap}>
                <div className="px-3 py-2 rounded-lg bg-brand-orange/10 dark:bg-brand-orange/20 border border-brand-orange/30 text-brand-orange font-extrabold text-xs uppercase tracking-[0.2em]">
                  Par Prices
                </div>

                <CatalogTable
                  title="MEZZO"
                  headers={['Style', '1–9', '10–19', '20+']}
                  rows={MEZZO.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1]), fmt(w.tiers[2])])}
                  density={density}
                />

                <CatalogTable
                  title="CASEMENT / AWNING"
                  headers={['Style', '1–14', '15+']}
                  rows={CASEMENT.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1])])}
                  density={density}
                />

                <CatalogTable
                  title="FUSION"
                  headers={['Style', '1–14', '15+']}
                  rows={FUSION.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1])])}
                  density={density}
                />

                <CatalogTable
                  title="BERTHA (IMPACT)"
                  headers={['Style', '1–9', '10–19', '20+']}
                  rows={BERTHA.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1]), fmt(w.tiers[2])])}
                  density={density}
                />

                <CatalogTable
                  title="143 SERIES (IMPACT)"
                  headers={['Style', '1–9', '10–19', '20+']}
                  rows={SERIES143.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1]), fmt(w.tiers[2])])}
                  density={density}
                />

                <CatalogTable
                  title="PATIO DOORS"
                  headers={['Size', 'Price']}
                  rows={PATIO.map((w) => [w.label, fmt(w.price)])}
                  tone="navy"
                  density={density}
                />

                <CatalogTable
                  title="IMPACT PATIO DOORS"
                  headers={['Size', 'Price']}
                  rows={IMPACT_PATIO.map((w) => [w.label, fmt(w.price)])}
                  tone="navy"
                  density={density}
                />

                <CatalogTable
                  title="ADDITIONAL OPTIONS"
                  headers={['Option', 'Price (each)']}
                  rows={OPTIONS.map((w) => [w.label, fmt(w.price)])}
                  tone="grey"
                  density={density}
                />
              </div>

              {/* ----------- RIGHT COLUMN — SIZE LIMITS ----------- */}
              <div className={colGap}>
                <div className="px-3 py-2 rounded-lg bg-brand-navy/10 dark:bg-brand-navy/30 border border-brand-navy/30 text-brand-navy dark:text-brand-orangeLight font-extrabold text-xs uppercase tracking-[0.2em]">
                  Size Limits
                </div>

                {SIZE_SECTIONS.map((sec, idx) => (
                  <CatalogTable
                    key={idx}
                    title={sec.title}
                    headers={sizeHeaders}
                    rows={sec.rows}
                    tone={sec.placeholder ? 'muted' : 'navy'}
                    muted={sec.placeholder}
                    density={density}
                    note={sec.note}
                  />
                ))}
              </div>
            </div>

          </div>
        );
      }

      // --------------------------------------------------------------------
      // App shell
      // --------------------------------------------------------------------
      function App() {
        const [view, setView] = useState('pricing');
        // Every setting below persists across refreshes and app relaunches.
        const [theme, setTheme] = usePersistedState('theme', 'light');
        const [colorTheme, setColorTheme] = usePersistedState('colorTheme', 'tempest');
        const [zoom, setZoom] = usePersistedState('zoom', 1);
        const [density, setDensity] = usePersistedState('density', 'compact');
        const [showTierHint, setShowTierHint] = usePersistedState('showTierHint', true);
        const [stickyTotals, setStickyTotals] = usePersistedState('stickyTotals', true);
        const [pickerMode, setPickerMode] = usePersistedState('pickerMode', 'split');
        // Quote-level, so it rides along with the job it belongs to and the
        // Reset button clears it back to standard terms.
        const [payMode, setPayMode] = usePersistedState('payMode', 'finance');

        // Lifted Pricing Tool state. Persisted so a refresh — including the
        // service worker's own update reload — never loses a job mid-
        // appointment. The Reset button is the only thing that clears it.
        const [form, setForm] = usePersistedState('form', BLANK_FORM);
        const [lines, setLines] = usePersistedState('lines', []);
        const [resetTick, setResetTick] = useState(0);

        useEffect(() => {
          const root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
        }, [theme]);

        // Palette depends on BOTH the theme and light/dark, so this reruns on
        // either. Also syncs the browser UI colour (iOS status bar, Android
        // chrome) so the app doesn't sit in a mismatched frame.
        useEffect(() => {
          const t = THEMES[colorTheme] || THEMES.tempest;
          const palette = (theme === 'dark' ? t.dark : t.light) || t.light;
          Object.entries(palette).forEach(([k, v]) => {
            document.documentElement.style.setProperty(k, v);
          });
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', 'rgb(' + palette['--c-accent'].split(' ').join(',') + ')');
        }, [colorTheme, theme]);

        const ZOOM_STEPS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0];
        const stepZoom = (dir) => {
          const idx = ZOOM_STEPS.findIndex((z) => Math.abs(z - zoom) < 0.001);
          const fallback = ZOOM_STEPS.findIndex((z) => z >= zoom);
          const cur = idx >= 0 ? idx : Math.max(0, fallback);
          const next = Math.min(ZOOM_STEPS.length - 1, Math.max(0, cur + dir));
          setZoom(ZOOM_STEPS[next]);
        };

        return (
          <div className="min-h-screen flex flex-col bg-page bg-page transition-colors">
            <Header
              view={view}
              setView={setView}
              theme={theme}
              setTheme={setTheme}
              colorTheme={colorTheme}
              setColorTheme={setColorTheme}
              zoom={zoom}
              onZoomIn={() => stepZoom(1)}
              onZoomOut={() => stepZoom(-1)}
              onZoomReset={() => setZoom(1)}
              density={density}
              setDensity={setDensity}
              showTierHint={showTierHint}
              setShowTierHint={setShowTierHint}
              stickyTotals={stickyTotals}
              setStickyTotals={setStickyTotals}
              pickerMode={pickerMode}
              setPickerMode={setPickerMode}
            />
            <main
              className="flex-1 px-4 sm:px-8 py-6 max-w-[1180px] w-full mx-auto origin-top transition-transform"
              style={{ zoom: zoom }}
            >
              {/* Both views stay mounted so Pricing Tool input is preserved across tab switches */}
              <div style={{ display: view === 'pricing' ? 'block' : 'none' }}>
                <PricingTool
                  form={form}
                  setForm={setForm}
                  lines={lines}
                  setLines={setLines}
                  resetTick={resetTick}
                  setResetTick={setResetTick}
                  density={density}
                  showTierHint={showTierHint}
                  stickyTotals={stickyTotals}
                  pickerMode={pickerMode}
                  payMode={payMode}
                  setPayMode={setPayMode}
                />
              </div>
              <div style={{ display: view === 'catalog' ? 'block' : 'none' }}>
                <Catalog density={density} />
              </div>
            </main>
            <footer className="px-5 sm:px-8 py-4 text-[11px] text-muted border-t border-line flex flex-col sm:flex-row gap-2 justify-between">
              <div>© Tempest Windows — Sales Rep Pricing Calculator</div>
              <div>
                Built from <span className="font-mono">JOB ESTIMATOR MASTER.xlsx</span>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
