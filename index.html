    <script>
      // ------------------------------------------------------------------
      // Service worker — MANUAL UPDATES ONLY.
      //
      // The app never updates itself. Whatever build is cached is the build
      // the rep keeps until somebody opens Settings and taps "Check for
      // updates", because a quote changing mid-appointment is worse than a
      // quote being a few days old.
      //
      // So there is deliberately nothing here that looks for a new version:
      // no periodic reg.update(), no re-check when the app comes back to the
      // foreground, no controllerchange banner. sw.js does the matching half
      // (stable cache, install never overwrites, navigations served from
      // cache with no background re-fetch) — see the comments in that file.
      //
      // Everything that can pull a new build hangs off jeCheckForUpdates /
      // jeForceRefresh below, and those only run when the button is tapped.
      // ------------------------------------------------------------------
      window.APP_VERSION = 'v1.16.0';
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        window.addEventListener('load', function () {
          // updateViaCache:'none' makes the browser bypass its HTTP cache
          // when it checks sw.js. GitHub Pages serves sw.js with
          // max-age=600, so without this a manual check could read a
          // ten-minute-old copy.
          navigator.serviceWorker
            .register('sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              window.__jeSwReg = reg;
              // A worker left waiting by an older build would otherwise sit
              // there forever. Promoting it is safe: the worker's code can
              // change without touching which app version is cached.
              if (reg.waiting && navigator.serviceWorker.controller) {
                reg.waiting.postMessage({ type: 'je-skip-waiting' });
              }
            })
            .catch(function () {});
        });
      }
      // Safari fires its own gesture* events for a pinch, and touch-action
      // doesn't stop those — without this, pinch-zoom still works on iOS even
      // with user-scalable=no. Passive:false is required or preventDefault is
      // ignored. Scrolling is untouched; only the pinch is swallowed.
      //
      // Deliberately NOT paired with a touchend double-tap guard: cancelling
      // touchend also cancels the click, so two quick taps on "+ Add to Job"
      // would silently drop the second line. touch-action above already
      // covers double-tap zoom.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
      // Called only from the Settings "Check for updates" button.
      window.jeCheckForUpdates = function () {
        if (window.__jeSwReg && window.__jeSwReg.update) {
          return window.__jeSwReg.update();
        }
        return Promise.resolve();
      };

      // What version is actually deployed right now?
      //
      // reg.update() alone can't answer this: it only reacts to a byte change
      // in sw.js, so a deploy that ships a new index.html without bumping the
      // worker's VERSION is completely invisible to it — "Check for updates"
      // would report "you're on the latest version" forever while the cache
      // kept serving the old build. Reading the deployed APP_VERSION straight
      // off the network is the ground truth, independent of all of that.
      //
      // The unique query param is what defeats the HTTP cache (and the
      // service worker routes this param straight to the network). Resolves
      // to null when offline or unparseable — the caller must treat that as
      // "don't know", never as "up to date".
      window.jeFetchDeployedVersion = function () {
        var url = './index.html?je-version-probe=' + Date.now();
        return fetch(url, { cache: 'no-store' })
          .then(function (res) {
            return res && res.ok ? res.text() : null;
          })
          .then(function (html) {
            if (!html) return null;
            var m = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
            return m ? m[1] : null;
          })
          .catch(function () {
            return null;
          });
      };

      // Replace the cached build with what's deployed, then reload onto it.
      //
      // A bare location.reload() is NEVER sufficient here: the worker answers
      // navigations from cache, so a plain reload just re-serves the same
      // stale shell — the app appears to update and doesn't. Something has to
      // invalidate the cache first, and this tries two independent ways so a
      // missing or idle worker can't leave the app stranded.
      window.jeForceRefresh = async function () {
        var sw = navigator.serviceWorker;

        // Preferred: the worker re-pulls the whole shell list in one go.
        // Note .controller can be null on a page the worker hasn't claimed
        // yet, so fall back to the registration's active worker rather than
        // assuming there's nobody to talk to.
        try {
          var reg = window.__jeSwReg || (sw && (await sw.getRegistration()));
          var target = (sw && sw.controller) || (reg && reg.active);
          if (target) {
            var refreshed = await new Promise(function (resolve) {
              function onMsg(e) {
                if (e.data && e.data.type === 'je-shell-refreshed') {
                  sw.removeEventListener('message', onMsg);
                  resolve(true);
                }
              }
              sw.addEventListener('message', onMsg);
              target.postMessage({ type: 'je-refresh-shell' });
              setTimeout(function () {
                sw.removeEventListener('message', onMsg);
                resolve(false);
              }, 5000);
            });
            if (refreshed) {
              location.reload();
              return;
            }
          }
        } catch (e) {
          /* fall through to the backstop */
        }

        // Backstop: evict the cached shell from the page itself. The Cache API
        // is available here too, so this works with no cooperation from the
        // worker at all — the next navigation misses and has to go to the
        // network. Cache name must match CACHE in sw.js.
        try {
          var cache = await caches.open('je-shell');
          await Promise.all(
            ['./', './index.html'].map(function (u) {
              return cache.delete(u);
            }),
          );
        } catch (e) {
          /* nothing left to try — reload and hope */
        }
        location.reload();
      };
    </script>
    <script>
      // Surface any boot-time JS error directly on the page so a white screen
      // never happens silently — the user can read the actual problem.
      window.addEventListener('error', function (e) {
        var msg = (e && (e.message || e.error)) ? (e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')) : 'Unknown error';
        var root = document.getElementById('root');
        if (root && !root.__errored) {
          root.__errored = true;
          root.innerHTML =
            '<div style="font-family:ui-sans-serif,system-ui;padding:24px;color:#1a1a1a;background:#fff;min-height:100vh;">' +
              '<h2 style="margin:0 0 8px 0;color:#C8102E;">Job Estimator failed to load</h2>' +
              '<p style="margin:0 0 12px 0;font-size:14px;">Open this in a browser, hard-refresh (Ctrl+Shift+R / Cmd+Shift+R), or screenshot the error below:</p>' +
              '<pre style="background:#F2F4F7;border:1px solid #8A94A6;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;">' +
                String(msg).replace(/[<>&]/g, function (c) { return { '<':'&lt;','>':'&gt;','&':'&amp;' }[c]; }) +
              '</pre>' +
            '</div>';
        }
      });
    </script>

      //
      // Every cash figure on screen — the KPI total, the quote footer, the

      //
      // The rate comes off the pricing sheet. It is NOT "undo the quoted

      //

      //

      // --------------------------------------------------------------------
      const CASH_DISCOUNT_RATE = 0.06363636363636364;

      const round2 = (n) => Math.round((n || 0) * 100) / 100;

      // Cash terms for a quoted total: what the customer pays, and what the
      // savings line reads.
      //
      // The cash PRICE is derived from the rate, and the savings line is then
      // the remainder — not the other way round. The price is the number the
      // customer pays and the office reconciles against the sheet, so it's
      // the one that has to be right to the penny; the savings line is
      // presentational. Taking the remainder also keeps the three printed
      // rows (total, savings, cash price) adding up exactly, with no penny

        const quoted = round2(quotedTotal);
        const cents = Math.round(quoted * 100);
        const total = Math.round(cents * (1 - CASH_DISCOUNT_RATE)) / 100;
        return { quoted, discount: round2(quoted - total), total };
      }

      const fmt = (n) =>
        new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2,
        }).format(n || 0);

      // --------------------------------------------------------------------
      // --------------------------------------------------------------------
      // Persisted settings
      //
      // Same shape as useState, but the value survives refreshes, app
      // relaunches, and the service worker's update reload. Wrapped in
      // try/catch because Safari private mode throws on localStorage access
      // rather than just returning null — a settings write must never be able
      // to take down the app.
      // --------------------------------------------------------------------
      function usePersistedState(key, initialValue) {
        const storageKey = 'je:' + key;
        const [value, setValue] = useState(() => {
          try {
            const raw = localStorage.getItem(storageKey);
            return raw === null ? initialValue : JSON.parse(raw);
          } catch (e) {
            return initialValue;
          }
        });
        useEffect(() => {
          try {
            localStorage.setItem(storageKey, JSON.stringify(value));
          } catch (e) {
            /* storage unavailable — settings just won't persist this session */
          }
        }, [storageKey, value]);
        return [value, setValue];
      }

      // --------------------------------------------------------------------
      // Viewport width as state, rather than only as a CSS breakpoint.
      //
      // The line-items table drops its Family and Color columns on a phone,
      // and a footer's colSpan has to match the number of columns actually
      // rendered. That's a number, which no `sm:` class can express — so the
      // breakpoint is read here and the columns and the spans come off the
      // same boolean and can't disagree.
      // --------------------------------------------------------------------
      function useIsWide(query = '(min-width: 640px)') {
        const [wide, setWide] = useState(() => {
          try {
            return window.matchMedia(query).matches;
          } catch (e) {
            return true; // assume desktop rather than collapsing columns
          }
        });
        useEffect(() => {
          let mq;
          try {
            mq = window.matchMedia(query);
          } catch (e) {
            return;
          }
          const onChange = (e) => setWide(e.matches);
          setWide(mq.matches);
          // addEventListener on a MediaQueryList is missing on older iOS
          // Safari, where addListener is still the working path.
          if (mq.addEventListener) mq.addEventListener('change', onChange);
          else mq.addListener(onChange);
          return () => {
            if (mq.removeEventListener) mq.removeEventListener('change', onChange);
            else mq.removeListener(onChange);
          };
        }, [query]);
        return wide;
      }

      function EditableName({ value, placeholder, onChange, onCommit }) {
        const ref = useRef(null);
        // No dep array on purpose: the wrap changes with the viewport, the
        // density setting and the Family/Color columns coming and going, not

        useEffect(() => {

      function UpdateRow() {
        const [status, setStatus] = useState('');
        const [busy, setBusy] = useState(false);
        // Compare the running build against what's actually deployed, rather
        // than inferring it from whether a new service worker turned up.
        //
        // The old version of this waited 1200ms and said "you're on the
        // latest version" if no banner had appeared yet — which was a guess,
        // and wrong twice over: it reported up-to-date when the worker was
        // still installing on a slow connection, and it reported up-to-date
        // when sw.js hadn't changed and so nothing would EVER appear. Asking
        // the network for the deployed version answers the question directly.
        const check = async () => {
          setBusy(true);
          setStatus('Checking…');
          try {
            // Kick the worker's own code update, but deliberately DON'T wait
            // on it. Measured at ~2.8s locally and worse on cellular, and it
            // has no bearing on the answer — blocking the button on it just
            // makes it look dead. The probe is both fast (~5ms) and
            // authoritative about what's deployed.
            if (window.jeCheckForUpdates) {
              try {
                const p = window.jeCheckForUpdates();
                if (p && p.catch) p.catch(() => {});
              } catch (e) {
                /* worker update is best-effort */
              }
            }
            const deployed = window.jeFetchDeployedVersion
              ? await window.jeFetchDeployedVersion()
              : null;
            const running = window.APP_VERSION || 'v0';

            if (deployed === null) {
              // Couldn't reach the network. Say so — don't claim up to date.
              setStatus('No connection — try again on Wi-Fi.');
              setBusy(false);
              return;
            }
            if (deployed !== running) {
              setStatus(`Updating to ${deployed}…`);
              window.jeForceRefresh();
              return; // page is about to reload
            }
            setStatus(`You're on the latest version (${deployed}).`);
            setBusy(false);
          } catch (e) {
            setStatus('Check failed — try again.');
            setBusy(false);
          }
        };
        return (
          <div className="pt-3 border-t border-line">
            <div className="text-[10px] uppercase tracking-[0.2em] font-semibold text-muted mb-1.5">
              About
            </div>

                <span className="text-xs text-muted tabular-nums">
                  {window.APP_VERSION || 'v0'}
                </span>
              </div>
              <button
                onClick={check}
                disabled={busy}
                className="w-full rounded-lg bg-surface2 hover:bg-line text-content text-xs font-semibold px-3 py-2 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
              >
                Check for updates
              </button>
              {status && <div className="text-xs text-muted">{status}</div>}
            </div>
          </div>
        );
      }

          rowX: compact ? 'px-2.5' : 'px-4',
          gapY: compact ? 'space-y-3' : 'space-y-6',
          kpiGap: compact ? 'gap-2' : 'gap-4',
        };

        // Total units across the job = sum of all primary-window line quantities.
        const totalUnits = useMemo(
          () =>
            lines.reduce((sum, ln) => {
              const item = ITEM_BY_ID[ln.itemId];
              if (!item || item.family === 'Add-on') return sum;
              return sum + Number(ln.qty || 0);
            }, 0),
          [lines],
        );

        const currentItem = ITEM_BY_ID[form.itemId];
        const qtyNum = Number(form.qty || 0);

        // Live preview: include this in-progress line in the tier roll-up
        const previewTotalUnits = useMemo(() => {
          if (!currentItem || currentItem.family === 'Add-on') return totalUnits;
          return totalUnits + qtyNum;
        }, [totalUnits, currentItem, qtyNum]);

        const currentLinePrice = useMemo(
          () => linePrice(currentItem, qtyNum, form.colorKey, previewTotalUnits),
          [currentItem, qtyNum, form.colorKey, previewTotalUnits],
        );

        // Net (final) total — what they actually pay at the locked-in volume tier.
        const jobNetTotal = useMemo(() => {
          return lines.reduce((sum, ln) => {
            const item = ITEM_BY_ID[ln.itemId];
            return sum + linePrice(item, Number(ln.qty || 0), ln.colorKey, totalUnits);
          }, 0);
        }, [lines, totalUnits]);

        // Gross subtotal — same lines priced at the un-discounted tier-1 (1–9 / 1–14) rate.
        const jobGrossTotal = useMemo(() => {
          return lines.reduce((sum, ln) => {
            const item = ITEM_BY_ID[ln.itemId];
            return sum + lineSubtotalGross(item, Number(ln.qty || 0), ln.colorKey);
          }, 0);
        }, [lines]);

        const volumeSavings = jobGrossTotal - jobNetTotal;
        const grandTotal = jobNetTotal + currentLinePrice;

        // Cash quotes don't reprice the job — the lines, the subtotal and the
        // volume savings are all identical. The only difference is a savings
        // line at the bottom, so both totals are derived from the finance
        // numbers already computed above.
        const isCash = payMode === 'cash';
        const netTerms = useMemo(() => cashTerms(jobNetTotal), [jobNetTotal]);
        const grandTerms = useMemo(() => cashTerms(grandTotal), [grandTotal]);

        // The quote shows ONE total, with every deduction listed above it.
        //
        // Cash used to print a second total ("Total" then "Cash Price"), which
        // read as two competing prices and invited the customer to ask which
        // one was real. The cash discount is still taken off the financed
        // total — netTerms does that — it just isn't shown as a line of its
        // own; it lands in this list next to the volume saving instead.
        const savingsLines = [];
        if (volumeSavings > 0) {
          savingsLines.push({ key: 'volume', label: 'Volume Savings', amount: volumeSavings });
        }
        if (isCash && netTerms.discount > 0) {
          savingsLines.push({ key: 'cash', label: 'Cash Savings', amount: netTerms.discount });
        }
        const displayNetTotal = isCash ? netTerms.total : netTerms.quoted;

        // Tier optimizer: find the closest upcoming break across all tier types in the job.
        // The label is generic ("units") — every primary line, doors included, counts toward totalUnits.
        const tierTip = useMemo(() => {
          if (totalUnits <= 0) return [];
          const candidates = [];
          const usingMezzo = lines.some((ln) => ITEM_BY_ID[ln.itemId]?.tierType === 'mezzo');
          const usingCasement = lines.some((ln) => ITEM_BY_ID[ln.itemId]?.tierType === 'casement');
          if (usingMezzo) {
            if (totalUnits < 10) candidates.push({ target: 10, label: '10–19' });
            else if (totalUnits < 20) candidates.push({ target: 20, label: '20+' });
          }
          if (usingCasement && totalUnits < 15) {
            candidates.push({ target: 15, label: '15+' });
          }
          if (!candidates.length) return [];
          // Pick the closest reachable break (within 6 units)
          candidates.sort((a, b) => a.target - b.target);
          const next = candidates.find((c) => c.target - totalUnits <= 6 && c.target - totalUnits > 0);
          if (!next) return [];
          const atCurrent = lines.reduce(
            (s, ln) => s + linePrice(ITEM_BY_ID[ln.itemId], Number(ln.qty || 0), ln.colorKey, totalUnits),
            0,
          );
          const atTarget = lines.reduce(
            (s, ln) => s + linePrice(ITEM_BY_ID[ln.itemId], Number(ln.qty || 0), ln.colorKey, next.target),
            0,
          );
          const savings = atCurrent - atTarget;
          if (savings <= 0) return [];
          // Quote the break in whatever terms the rep is showing — on a cash
          // quote the tier saving gets discounted right along with the total,
          // so an undiscounted figure here would overstate it.
          return [
            {
              needed: next.target - totalUnits,
              nextTier: next.label,
              savings: isCash ? cashTerms(savings).total : savings,
            },
          ];
        }, [lines, totalUnits, isCash]);

        function addLine() {
          if (!form.itemId || !qtyNum) return;
          setLines((ls) => [...ls, { ...form, qty: qtyNum, key: Date.now() }]);
          setForm({ ...blank });
        }

        function resetAll() {
          setForm({ ...blank });
          setLines([]);
          // A new appointment starts on standard terms — cash is something the
          // rep opts into per customer, not a setting they inherit.
          setPayMode('finance');
          setResetTick((t) => t + 1);
        }

        const kpiCardPad = compact ? 'p-3' : 'p-5';
        const kpiCardLabel =
          'text-[10px] uppercase tracking-[0.2em] text-muted font-semibold';
        const kpiCardValue = (compact ? 'text-2xl' : 'text-3xl') + ' font-extrabold tabular-nums';

        return (
          <div className={d.gapY}>
            {/* KPI strip. Two renderings, because the three cards stack at
                phone width into a ~500px column — sticky, that covered most of
                the screen and sat on top of the payment toggle and the tier
                hint. Phones get one compact line with the two figures a rep
                actually watches while scrolling; md+ keeps the full strip. */}
            <div
              className={
                'md:hidden -mx-4 px-4 ' +
                (stickyTotals
                  ? 'sticky top-0 z-30 py-2 bg-page/95 backdrop-blur'
                  : '')
              }
            >
              <Card className="px-4 py-2.5 flex items-center justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[10px] uppercase tracking-[0.18em] text-muted font-semibold">
                    Units
                  </div>
                  <div className="text-xl font-extrabold tabular-nums text-content leading-tight">
                    {previewTotalUnits}
                  </div>
                </div>
                <div className="min-w-0 text-right">
                  <div className="text-[10px] uppercase tracking-[0.18em] text-muted font-semibold">
                    {isCash ? 'Cash Total' : 'Financed Total'}
                  </div>
                  <div className="text-xl font-extrabold tabular-nums text-brand-orange leading-tight">
                    {fmt(isCash ? grandTerms.total : grandTotal)}
                  </div>
                </div>
              </Card>
            </div>

            {/* The tier is reference, not a running total, so on a phone it
                stays in normal flow rather than riding along in the sticky bar. */}
            <Card className={'md:hidden ' + kpiCardPad}>
              <div className={kpiCardLabel}>Volume Tier</div>
              <div className="mt-1 text-sm font-semibold text-content">
                {tierLabel(previewTotalUnits)}
              </div>
            </Card>

            <div
              className={
                'hidden md:block ' +
                (stickyTotals ? 'sticky top-0 z-30 -mx-8 px-8 py-2 bg-page/95 backdrop-blur' : '')
              }
            >
              <div className={'grid grid-cols-3 ' + d.kpiGap}>
                <Card className={kpiCardPad}>
                  <div className={kpiCardLabel}>Total Units</div>
                  <div className={'mt-1 ' + kpiCardValue + ' text-content'}>
                    {previewTotalUnits}
                  </div>
                </Card>
                <Card className={kpiCardPad}>
                  <div className={kpiCardLabel}>Total Amount</div>
                  <div className={'mt-1 ' + kpiCardValue + ' text-brand-orange'}>
                    {fmt(isCash ? grandTerms.total : grandTotal)}
                  </div>
                  <div className="mt-0.5 text-[11px] font-semibold text-muted">
                    {isCash ? 'Cash terms' : 'Financed terms'}
                  </div>
                </Card>
                <Card className={kpiCardPad}>
                  <div className={kpiCardLabel}>Volume Tier</div>
                  <div className="mt-1 text-sm font-semibold text-content">
                    {tierLabel(previewTotalUnits)}
                  </div>
                </Card>
              </div>
            </div>

            {/* Tier optimizer hint — hidden when the rep disables it in settings */}
            {showTierHint && tierTip.length > 0 && (
              <div className="space-y-2">
                {tierTip.map((t, i) => (
                  <div
                    key={i}
                    className={
                      'rounded-xl bg-brand-orange/10 border border-brand-orange/30 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 ' +
                      (compact ? 'px-3 py-2' : 'px-4 py-3')
                    }
                  >
                    <div className={compact ? 'text-xl' : 'text-2xl'}>⭐</div>
                    <div className="flex-1 text-sm text-content">
                      <span className="font-bold">
                        Add {t.needed} more unit{t.needed === 1 ? '' : 's'}
                      </span>{' '}
                      to unlock the <span className="font-bold">{t.nextTier}</span> volume tier — drops existing line
                      prices by <span className="font-extrabold text-brand-orange">{fmt(t.savings)}</span>.
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Estimator form */}
            <Card className="overflow-hidden">
              <div className={'bg-ink text-onInk flex items-center justify-between gap-3 ' + d.sectionTight}>
                <div className="font-bold tracking-tight">Add an Item</div>
                <button
                  onClick={resetAll}
                  className="inline-flex items-center justify-center gap-2 rounded-lg bg-danger hover:brightness-110 text-white px-3 py-1.5 text-xs font-bold tracking-wide shadow-sm transition-colors ring-1 ring-white/25"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.4"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className="w-3.5 h-3.5"
                  >
                    <path d="M3 12a9 9 0 1 0 3-6.7" />
                    <path d="M3 4v5h5" />
                  </svg>
                  Reset
                </button>
              </div>
              <div className={'grid grid-cols-1 md:grid-cols-12 ' + d.form}>
                {isSplitPicker ? (
                  <Fragment>
                    <div className="md:col-span-6">
                      <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                        Category
                      </label>
                      <select
                        key={'family-' + resetTick}
                        value={form.familyKey}
                        onChange={(e) =>
                          // Picking a new category also clears the type selection,
                          // otherwise a leftover itemId would silently price the
                          // wrong line.
                          setForm((f) => ({ ...f, familyKey: e.target.value, itemId: '' }))
                        }
                        className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange"
                      >
                        <option value="">Select category…</option>
                        {FAMILIES.map((fam) => (
                          <option key={fam.key} value={fam.key}>
                            {fam.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="md:col-span-6">
                      <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                        Type
                      </label>
                      <select
                        key={'item-' + resetTick + '-' + form.familyKey}
                        value={form.itemId}
                        onChange={(e) => setForm((f) => ({ ...f, itemId: e.target.value }))}
                        disabled={!form.familyKey}
                        className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange disabled:opacity-50 disabled:cursor-not-allowed"
                      >
                        <option value="">
                          {form.familyKey ? 'Select type…' : 'Pick a category first…'}
                        </option>
                        {form.familyKey &&
                          (FAMILIES.find((f) => f.key === form.familyKey)?.items || []).map((w) => (
                            <option key={w.id} value={w.id}>
                              {w.label}
                            </option>
                          ))}
                      </select>
                    </div>
                  </Fragment>
                ) : (
                  /* Classic: one long grouped list. Setting familyKey alongside
                     itemId keeps state valid if the rep switches back to split. */
                  <div className="md:col-span-5">
                    <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                      Product Type
                    </label>
                    <select
                      key={'item-classic-' + resetTick}
                      value={form.itemId}
                      onChange={(e) => {
                        const id = e.target.value;
                        const picked = ITEM_BY_ID[id];
                        setForm((f) => ({ ...f, itemId: id, familyKey: picked ? picked.family : '' }));
                      }}
                      className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange"
                    >
                      <option value="">Select product type…</option>
                      {FAMILIES.map((fam) => (
                        <optgroup key={fam.key} label={fam.label}>
                          {fam.items.map((w) => (
                            <option key={w.id} value={w.id}>
                              {w.label}
                            </option>
                          ))}
                        </optgroup>
                      ))}
                    </select>
                  </div>
                )}

                <div className={isSplitPicker ? 'md:col-span-3' : 'md:col-span-2'}>
                  <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                    Quantity
                  </label>
                  <input
                    key={'qty-' + resetTick}
                    type="number"
                    min="0"
                    placeholder="0"
                    value={form.qty}
                    onChange={(e) => setForm((f) => ({ ...f, qty: e.target.value }))}
                    className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-semibold text-content focus:outline-none focus:ring-2 focus:ring-brand-orange tabular-nums"
                  />
                </div>

                <div className={isSplitPicker ? 'md:col-span-9' : 'md:col-span-5'}>
                  <label className="text-xs font-semibold uppercase tracking-wider text-muted">
                    Color
                  </label>
                  <select
                    key={'color-' + resetTick}
                    value={form.colorKey}
                    onChange={(e) => setForm((f) => ({ ...f, colorKey: e.target.value }))}
                    disabled={currentItem && currentItem.tierType === 'flat'}
                    title={currentItem && currentItem.tierType === 'flat' ? 'Color does not apply to add-on options' : ''}
                    className="mt-1 w-full rounded-xl border border-line bg-surface px-3 py-2.5 text-sm font-medium text-content focus:outline-none focus:ring-2 focus:ring-brand-orange disabled:opacity-50"
                  >
                    {COLORS.map((c) => (
                      <option key={c.key} value={c.key}>
                        {c.label} {c.multiplier !== 1 ? `(+${Math.round((c.multiplier - 1) * 100)}%)` : ''}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Live line readout */}
                <div className="md:col-span-12">
                  <div
                    className={
                      'rounded-xl bg-surface2 border border-line flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6 ' +
                      (compact ? 'px-3 py-2' : 'px-4 py-3')
                    }
                  >
                    <div className="flex-1 text-sm text-content">
                      {currentItem ? (
                        <Fragment>
                          <span className="font-semibold">{currentItem.label}</span>
                          <span className="text-muted">
                            {' '}
                            • {currentItem.family}
                          </span>
                        </Fragment>
                      ) : (
                        <span className="text-muted">
                          Pick a product type to preview the price.
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-4">
                      <div className="text-right">
                        <div className="text-[10px] uppercase tracking-[0.2em] text-muted font-semibold">
                          Line Price
                        </div>
                        <div className="text-xl font-extrabold text-brand-orange tabular-nums">
                          {fmt(currentLinePrice)}
                        </div>
                      </div>
                      <button
                        onClick={addLine}
                        disabled={!form.itemId || !qtyNum}
                        className="rounded-xl bg-brand-orange hover:brightness-110 text-onAccent px-4 py-2.5 text-sm font-bold shadow-sm disabled:bg-surface disabled:text-muted disabled:ring-1 disabled:ring-line disabled:shadow-none disabled:cursor-not-allowed transition-colors"
                      >
                        + Add to Job
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </Card>

            {/* Job line items */}
            <Card className="overflow-hidden">
              <div className={'bg-ink text-onInk flex items-center justify-between ' + d.section}>
                <div className="font-bold tracking-tight">Job Line Items</div>
                <Pill tone="onInk">{lines.length} line{lines.length === 1 ? '' : 's'}</Pill>
              </div>

              {/* Payment terms. Sits with the line items, immediately above the
                  total it changes, rather than up by the form — the rep flips
                  it while reading the quote back to the customer. */}
              <div
                className={
                  'flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-line ' +
                  d.sectionTight
                }
              >
                <div className="flex items-center gap-3">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-muted font-semibold">
                    Payment
                  </span>
                  <Toggle
                    ariaLabel="Payment terms"
                    value={payMode}
                    onChange={setPayMode}
                    options={[
                      { value: 'finance', label: 'Finance' },
                      { value: 'cash', label: 'Cash' },
                    ]}
                  />
                </div>
              </div>

              {lines.length === 0 ? (
                <div className="p-8 text-center text-muted text-sm">
                  No items added yet. Build your estimate above.
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-surface2 text-content uppercase text-[10px] tracking-wider">
                      {/* Header gutters track the body cells' (d.rowX) rather
                          than a fixed px-4, so the columns line up and the
                          numeric ones stop claiming width they don't need. */}
                      <tr>
                        <th className={d.rowX + ' py-2 text-left'}>Item</th>
                        {isWide && <th className={d.rowX + ' py-2 text-left'}>Family</th>}
                        {isWide && <th className={d.rowX + ' py-2 text-left'}>Color</th>}
                        <th className={d.rowX + ' py-2 text-right whitespace-nowrap w-px'}>Qty</th>
                        <th className={d.rowX + ' py-2 text-right whitespace-nowrap w-px'}>
                          <span className="sm:hidden">Price</span>
                          <span className="hidden sm:inline">Line Price</span>
                        </th>
                        <th className="px-2 py-2 w-px"></th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-line">
                      {lines.map((ln, idx) => {
                        const item = ITEM_BY_ID[ln.itemId];
                        const color = COLORS.find((c) => c.key === ln.colorKey);
                        const td = d.rowX + ' ' + d.rowY;
                        return (
                          <tr key={ln.key} className="hover:bg-surface2">
                            <td className={td + ' font-semibold text-content align-top'}>
                              {item ? (
                                <EditableName
                                  value={ln.label !== undefined ? ln.label : item.label}
                                  placeholder={item.label}
                                  onChange={(v) =>
                                    setLines((ls) =>
                                      ls.map((l, i) => (i === idx ? { ...l, label: v } : l)),
                                    )
                                  }
                                  // Blanking it falls back to the catalog name
                                  // rather than leaving a nameless line on the
                                  // quote.
                                  onCommit={() =>
                                    setLines((ls) =>
                                      ls.map((l, i) => {
                                        if (i !== idx) return l;
                                        if (l.label !== undefined && l.label.trim() === '') {
                                          const { label, ...rest } = l;
                                          return rest;
                                        }
                                        return l;
                                      }),
                                    )
                                  }
                                />
                              ) : (
                                '—'
                              )}
                              {!isWide && item && (
                                <div className="mt-0.5 text-[11px] font-medium text-muted">
                                  {item.family}
                                  {item.tierType !== 'flat' && color ? ' · ' + color.label : ''}
                                </div>
                              )}
                            </td>
                            {isWide && (
                              <td className={td + ' text-muted'}>
                                {item ? item.family : '—'}
                              </td>
                            )}
                            {isWide && (
                              <td className={td + ' text-muted'}>
                                {!item || item.tierType === 'flat' ? '—' : color ? color.label : '—'}
                              </td>
                            )}
                            <td className={td + ' text-right whitespace-nowrap'}>
                              <input
                                type="number"
                                min="0"
                                value={ln.qty}
                                onChange={(e) => {
                                  const v = e.target.value;
                                  setLines((ls) =>
                                    ls.map((l, i) =>
                                      i === idx ? { ...l, qty: v === '' ? 0 : Number(v) } : l,
                                    ),
                                  );
                                }}
                                className="w-12 sm:w-16 text-right tabular-nums font-medium text-content bg-transparent rounded-md px-1.5 py-1 border border-transparent hover:border-line hover:bg-surface focus:bg-surface focus:ring-2 focus:ring-brand-orange focus:outline-none focus:border-transparent"
                              />
                            </td>
                            <td
                              className={
                                td + ' text-right tabular-nums font-bold text-brand-orange whitespace-nowrap'
                              }
                            >
                              {fmt(linePrice(item, Number(ln.qty), ln.colorKey, totalUnits))}
                            </td>
                            <td className={d.rowY + ' px-2 text-right'}>
                              <button
                                onClick={() => setLines((ls) => ls.filter((_, i) => i !== idx))}
                                className="text-muted hover:text-danger font-bold text-lg leading-none"
                                aria-label="Remove line"
                              >
                                ×
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot className="bg-surface2">
                      {/* Only worth a row when something comes off it — with no
                          savings it would just restate the Total. */}
                      {savingsLines.length > 0 && (
                        <tr>
                          <td
                            colSpan={labelSpan}
                            className={d.rowX + ' py-2 text-right text-xs uppercase tracking-wider font-semibold text-muted'}
                          >
                            Subtotal
                          </td>
                          <td className={d.rowX + ' py-2 text-right text-sm font-bold text-content tabular-nums whitespace-nowrap'}>
                            {fmt(jobGrossTotal)}
                          </td>
                          <td></td>
                        </tr>
                      )}
                      {/* Every deduction, in one tinted block, so the quote reads
                          as a single list of savings rather than competing totals. */}
                      {savingsLines.map((sv, i) => (
                        <tr
                          key={sv.key}
                          className={
                            'bg-positive/10 ' + (i === 0 ? 'border-t border-line' : '')
                          }
                        >
                          <td
                            colSpan={labelSpan}
                            className={d.rowX + ' py-2 text-right text-xs uppercase tracking-wider font-semibold text-positive'}
                          >
                            {sv.label}
                          </td>
                          <td className={d.rowX + ' py-2 text-right text-sm font-extrabold text-positive tabular-nums whitespace-nowrap'}>
                            −{fmt(sv.amount)}
                          </td>
                          <td></td>
                        </tr>
                      ))}
                      <tr className="border-t-2 border-line">
                        <td
                          colSpan={labelSpan}
                          className={d.rowX + ' py-3 text-right text-xs uppercase tracking-[0.2em] font-bold text-content'}
                        >
                          Total
                        </td>
                        <td className={d.rowX + ' py-3 text-right text-lg font-extrabold text-brand-orange tabular-nums whitespace-nowrap'}>
                          {fmt(displayNetTotal)}
                        </td>
                        <td></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              )}
            </Card>

          </div>
        );
      }

      // --------------------------------------------------------------------
      // Catalog — replicates the spreadsheet's two-column layout:
      //   Left column  = PAR PRICES sections
      //   Right column = SIZE LIMITS sections
      // --------------------------------------------------------------------

      // Size-limit sections, taken directly from the Price_and_Sizes sheet.
      // Each row is [Style, Min W (in), Max W (in), Min H (in), Max H (in)].
      const SIZE_SECTIONS = [
        {
          title: 'MEZZO',
          rows: [
            ['DH', '12', '50', '20', '72'],
            ['2LS', '18.5', '96', '11.25', '72'],
            ['3LS 192 UI', '47.5', '120', '11.25', '72'],
            ['PIC 154 UI', '9.5', '112', '9.5', '112'],
            ['TRAPEZOID 154 UI', '12', '112', '6 / 11.5', '108'],
          ],
          note: 'Any DH between 72" and 96", or any DH with a top sash ≥ 36", must use a SH.',
        },
        {
          title: 'FUSION',
          rows: [
            ['CIR TOP', '11.5', '96', '6 / 12', '96 / 107'],
            ['CIR T w/leg 148 UI', '23.5', '96', '11.5', '48'],
            ['SPEC SH', '23.5', '47', '43', '96'],
            ['TRAP 192 UI', '23.5', '72', '18', '96'],
          ],
        },
        {
          title: 'PATIO DOORS',
          rows: [
            ['2 LITE 200', '47.5', '120', '47.5', '96'],
            ['3 LITE 216 UI', '71.5', '130', '47.5', '96'],
            ['4 LITE 240 UI', '95.5', '144', '47.5', '96'],
          ],
        },
        {
          title: 'MEZZO TRIPLE PANE',
          rows: [
            ['PIC', '9.5', '86', '9.5', '86'],
            ['PIC', '27', '84', '13.5', '42'],
            ['PIC', '27', '47', '43', '96'],
          ],
        },
        {
          title: 'MEZZO STUCCO SPECIALTY',
          rows: [
            ['PIC', '27', '60', '27', '60'],
            ['CIRCLE TOP', '27', '96', '13.5', '48'],
            ['CIR T w/leg', '27', '84', '15', '96'],
            ['PIC', '27', '47', '43', '96'],
          ],
          note: 'Use 80 Series on any Circle Top if width is below 27" (available down to 23.5").',
        },
      ];

      function CatalogTable({ title, headers, rows, tone = 'accent', muted = false, density = 'comfortable', note }) {
        const compact = density === 'compact';
        // Foreground is paired with each background rather than hardcoded to
        // white: on Monochrome dark the accent is near-white and the ink is
        // near-black, so a single fixed text colour is unreadable on one of
        // them no matter which you pick.
        // Was four entries for two styles: 'navy' and 'grey' were identical
        // and 'muted' was never passed.
        const headStyles = {
          accent: 'bg-brand-orange text-onAccent',
          ink: 'bg-ink text-onInk',
          // Placeholder sections carry no real data yet, so their head sits
          // back rather than claiming one of the two loud treatments.
          muted: 'bg-surface2 text-muted',
        };
        const headClass = headStyles[tone] || headStyles.accent;
        const headerPad = compact ? 'px-3 sm:px-4 py-1.5' : 'px-4 sm:px-5 py-2.5';
        const thPad = compact ? 'px-2 sm:px-3 py-1' : 'px-2 sm:px-3 py-2';
        const tdPad = compact ? 'px-2 sm:px-3 py-1' : 'px-2 sm:px-3 py-2';
        return (
          <Card className="overflow-hidden">
            <div className={'font-bold tracking-tight text-sm ' + headClass + ' ' + headerPad}>
              {title}
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs sm:text-sm">
                <thead>
                  <tr className="bg-surface2 text-content text-[10px] sm:text-[11px] uppercase tracking-wider">
                    {headers.map((h, i) => (
                      <th key={i} className={thPad + ' ' + (i === 0 ? 'text-left' : 'text-right')}>
                        {h}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-line">
                  {rows.map((r, i) => (
                    <tr
                      key={i}
                      className={
                        'hover:bg-surface2 ' +
                        (muted ? 'text-muted italic' : '')
                      }
                    >
                      {r.map((cell, j) => (
                        <td
                          key={j}
                          className={
                            tdPad +
                            ' ' +
                            (j === 0
                              ? 'text-left font-semibold ' + (muted ? '' : 'text-content')
                              : 'text-right tabular-nums ' + (muted ? '' : 'text-content'))
                          }
                        >
                          {cell}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {note && (
              <div
                className={
                  'border-t border-line text-[11px] italic text-muted ' +
                  (compact ? 'px-3 py-1.5' : 'px-4 py-2')
                }
              >
                {note}
              </div>
            )}
          </Card>
        );
      }

      function Catalog({ density = 'comfortable' }) {
        const compact = density === 'compact';
        const cardPad = compact ? 'p-3' : 'p-5';
        const colGap = compact ? 'space-y-3' : 'space-y-5';
        const sectionGap = compact ? 'space-y-3' : 'space-y-6';
        const sizeHeaders = ['Style', 'Min W (")', 'Max W (")', 'Min H (")', 'Max H (")'];

        return (
          <div className={sectionGap}>
            <Card className={cardPad}>
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div className="text-[10px] uppercase tracking-[0.2em] text-brand-orange font-bold">Catalog</div>
                  <div className="text-xl font-extrabold text-content">Par Prices & Size Limits</div>
                  <div className="text-sm text-muted mt-1">
                    Prices and sizes laid out side-by-side, matching the master spreadsheet. Apply the color factor
                    for Desert Clay or Black / Bronze.
                  </div>
                </div>
                <div className="flex flex-wrap gap-2">
                  <Pill tone="neutral">White / Beige ×1.00</Pill>
                  <Pill tone="accent">Desert Clay ×1.10</Pill>
                  <Pill tone="accentStrong">Black / Bronze ×1.25</Pill>
                </div>
              </div>
            </Card>

            <div className={'grid grid-cols-1 lg:grid-cols-2 items-start ' + (compact ? 'gap-3' : 'gap-6')}>
              {/* ----------- LEFT COLUMN — PAR PRICES ----------- */}
              <div className={colGap}>
                <div className="px-3 py-2 rounded-lg bg-brand-orange/10 dark:bg-brand-orange/20 border border-brand-orange/30 text-brand-orange font-extrabold text-xs uppercase tracking-[0.2em]">
                  Par Prices
                </div>

                <CatalogTable
                  title="MEZZO"
                  headers={['Style', '1–9', '10–19', '20+']}
                  rows={MEZZO.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1]), fmt(w.tiers[2])])}
                  density={density}
                />

                <CatalogTable
                  title="CASEMENT / AWNING"
                  headers={['Style', '1–14', '15+']}
                  rows={CASEMENT.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1])])}
                  density={density}
                />

                <CatalogTable
                  title="FUSION"
                  headers={['Style', '1–14', '15+']}
                  rows={FUSION.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1])])}
                  density={density}
                />

                <CatalogTable
                  title="BERTHA (IMPACT)"
                  headers={['Style', '1–9', '10–19', '20+']}
                  rows={BERTHA.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1]), fmt(w.tiers[2])])}
                  density={density}
                />

                <CatalogTable
                  title="143 SERIES (IMPACT)"
                  headers={['Style', '1–9', '10–19', '20+']}
                  rows={SERIES143.map((w) => [w.label, fmt(w.tiers[0]), fmt(w.tiers[1]), fmt(w.tiers[2])])}
                  density={density}
                />

                <CatalogTable
                  title="PATIO DOORS"
                  headers={['Size', 'Price']}
                  rows={PATIO.map((w) => [w.label, fmt(w.price)])}
                  tone="ink"
                  density={density}
                />

                <CatalogTable
                  title="IMPACT PATIO DOORS"
                  headers={['Size', 'Price']}
                  rows={IMPACT_PATIO.map((w) => [w.label, fmt(w.price)])}
                  tone="ink"
                  density={density}
                />

                <CatalogTable
                  title="ADDITIONAL OPTIONS"
                  headers={['Option', 'Price (each)']}
                  rows={OPTIONS.map((w) => [w.label, fmt(w.price)])}
                  tone="ink"
                  density={density}
                />
              </div>

              {/* ----------- RIGHT COLUMN — SIZE LIMITS ----------- */}
              <div className={colGap}>
                <div className="px-3 py-2 rounded-lg bg-ink/10 dark:bg-ink/30 border border-ink/30 text-ink dark:text-brand-orange font-extrabold text-xs uppercase tracking-[0.2em]">
                  Size Limits
                </div>

                {SIZE_SECTIONS.map((sec, idx) => (
                  <CatalogTable
                    key={idx}
                    title={sec.title}
                    headers={sizeHeaders}
                    rows={sec.rows}
                    tone={sec.placeholder ? 'muted' : 'ink'}
                    muted={sec.placeholder}
                    density={density}
                    note={sec.note}
                  />
                ))}
              </div>
            </div>

          </div>
        );
      }

      // --------------------------------------------------------------------
      // App shell
      // --------------------------------------------------------------------
      function App() {
        const [view, setView] = useState('pricing');
        // Every setting below persists across refreshes and app relaunches.
        const [theme, setTheme] = usePersistedState('theme', 'light');
        const [colorTheme, setColorTheme] = usePersistedState('colorTheme', 'tempest');
        const [zoom, setZoom] = usePersistedState('zoom', 1);
        const [density, setDensity] = usePersistedState('density', 'compact');
        const [showTierHint, setShowTierHint] = usePersistedState('showTierHint', true);
        const [stickyTotals, setStickyTotals] = usePersistedState('stickyTotals', true);
        const [pickerMode, setPickerMode] = usePersistedState('pickerMode', 'split');
        // Quote-level, so it rides along with the job it belongs to and the
        // Reset button clears it back to standard terms.
        const [payMode, setPayMode] = usePersistedState('payMode', 'finance');

        // Lifted Pricing Tool state. Persisted so a refresh — including the
        // service worker's own update reload — never loses a job mid-
        // appointment. The Reset button is the only thing that clears it.
        const [form, setForm] = usePersistedState('form', BLANK_FORM);
        const [lines, setLines] = usePersistedState('lines', []);
        const [resetTick, setResetTick] = useState(0);

        useEffect(() => {
          const root = document.documentElement;
          // AMOLED is a dark mode, so it has to carry the `dark` class too or
          // the handful of dark: utilities in the markup would render light.
          if (theme === 'light') root.classList.remove('dark');
          else root.classList.add('dark');
        }, [theme]);

        // Palette depends on BOTH the theme and light/dark, so this reruns on
        // either. Also syncs the browser UI colour (iOS status bar, Android
        // chrome) so the app doesn't sit in a mismatched frame.
        useEffect(() => {
          const t = THEMES[colorTheme] || THEMES.tempest;
          const palette = t[theme] || t.light;
          Object.entries(palette).forEach(([k, v]) => {
            document.documentElement.style.setProperty(k, v);
          });
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', 'rgb(' + palette['--c-accent'].split(' ').join(',') + ')');
        }, [colorTheme, theme]);

        const ZOOM_STEPS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0];
        const stepZoom = (dir) => {
          const idx = ZOOM_STEPS.findIndex((z) => Math.abs(z - zoom) < 0.001);
          const fallback = ZOOM_STEPS.findIndex((z) => z >= zoom);
          const cur = idx >= 0 ? idx : Math.max(0, fallback);
          const next = Math.min(ZOOM_STEPS.length - 1, Math.max(0, cur + dir));
          setZoom(ZOOM_STEPS[next]);
        };

        return (
          <div className="min-h-screen flex flex-col bg-page transition-colors">
            <Header
              view={view}
              setView={setView}
              theme={theme}
              setTheme={setTheme}
              colorTheme={colorTheme}
              setColorTheme={setColorTheme}
              zoom={zoom}
              onZoomIn={() => stepZoom(1)}
              onZoomOut={() => stepZoom(-1)}
              onZoomReset={() => setZoom(1)}
              density={density}
              setDensity={setDensity}
              showTierHint={showTierHint}
              setShowTierHint={setShowTierHint}
              stickyTotals={stickyTotals}
              setStickyTotals={setStickyTotals}
              pickerMode={pickerMode}
              setPickerMode={setPickerMode}
            />
            <main
              className="flex-1 px-4 sm:px-8 py-6 max-w-[1180px] w-full mx-auto origin-top transition-transform"
              style={{ zoom: zoom }}
            >
              {/* Both views stay mounted so Pricing Tool input is preserved across tab switches */}
              <div style={{ display: view === 'pricing' ? 'block' : 'none' }}>
                <PricingTool
                  form={form}
                  setForm={setForm}
                  lines={lines}
                  setLines={setLines}
                  resetTick={resetTick}
                  setResetTick={setResetTick}
                  density={density}
                  showTierHint={showTierHint}
                  stickyTotals={stickyTotals}
                  pickerMode={pickerMode}
                  payMode={payMode}
                  setPayMode={setPayMode}
                />
              </div>
              <div style={{ display: view === 'catalog' ? 'block' : 'none' }}>
                <Catalog density={density} />
              </div>
            </main>
            <footer className="px-5 sm:px-8 py-4 text-[11px] text-muted border-t border-line flex flex-col sm:flex-row gap-2 justify-between">
              <div>© Tempest Windows — Sales Rep Pricing Calculator</div>
              <div>
                Built from <span className="font-mono">JOB ESTIMATOR MASTER.xlsx</span>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
